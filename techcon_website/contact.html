  <header>
    <h1>Contact TechCon 2024</h1>
    <nav>

        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="schedule.html">Schedule</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>

  <main>
    <section>
      <h2>Get in Touch</h2>
      <p>If you have any questions about TechCon 2024, please use the form below or email us directly at <a href="mailto:info@techcon2024.com">info@techcon2024.com</a>.</p>

      <form action="#" method="post">
       
        <div>
          <label for="name">Your Name:</label><br>
          <input type="text" id="name" name="name" required>
        </div><br>

        
        <div>
          <label for="email">Your Email:</label><br>
          <input type="email" id="email" name="email" required>
        </div><br>

        
        <div>
          <label for="message">Message:</label><br>
          <textarea id="message" name="message" rows="5" cols="40" required></textarea>
        </div><br>

        
        <div>
          <button type="submit">Send Message</button>
        </div>
      </form>
    </section>
  </main>

  </footer>
