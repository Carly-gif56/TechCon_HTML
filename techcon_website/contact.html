<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - TechCon 2024</title>
  <style>
    /* Simple responsive iframe for the map */
    .map-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
    }

    .map-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <h1>Contact Us</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="schedule.html">Schedule</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Contact Information -->
    <section>
      <h2>Contact Information</h2>
      
      <p>Email us directly at:
        <a href="mailto:carlynnhrtz@gmail.com">carlynnhrtz@gmail.com</a>
      </p>

      <h3>Follow us on Social Media:</h3>
      <ul>
        <li><a href="https://x.com/CarolynnMu85835/" target="_blank">Twitter</a></li>
        <li><a href="https://www.facebook.com/carl.hertz.saeed.2025/" target="_blank">Facebook</a></li>
        <li><a href="https://www.linkedin.com/in/carolynn-mukami-022726246/" target="_blank">LinkedIn</a></li>
      </ul>
    </section>

    <!-- Embedded Google Map -->
    <section>
      <h2>Conference Venue</h2>
      <div class="map-container">
        <iframe 
          src="https://www.google.com/search?q=safari+park+directions&oq=safari+park+direct&gs_lcrp=EgZjaHJvbWUqBwgAEAAYgAQyBwgAEAAYgAQyBggBEEUYOTIICAIQABgWGB4yCAgDEAAYFhgeMggIBBAAGBYYHjIICAUQABgWGB4yCAgGEAAYFhgeMggIBxAAGBYYHjIICAgQABgWGB4yCAgJEAAYFhge0gEJMTYwNjVqMGo3qAIAsAIA&sourceid=chrome&ie=UTF-8"
          allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </section>

    <!-- Contact Us Form -->
    <section>
      <h2>Contact Us Form</h2>
      <form action="#" method="post">
        <!-- Name Field -->
        <div>
          <label for="name">Name:</label><br>
          <input type="text" id="name" name="name" required>
        </div><br>

        <!-- Email Field -->
        <div>
          <label for="email">Email:</label><br>
          <input type="email" id="email" name="email" required>
        </div><br>

        <!-- Message Field -->
        <div>
          <label for="message">Message:</label><br>
          <textarea id="message" name="message" rows="5" cols="40" required></textarea>
        </div><br>

        <!-- Submit Button -->
        <div>
          <button type="submit">Send Message</button>
        </div>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2024 TechCon. All rights reserved. <br>Explicit text: copyright</p>
  </footer>
</body>
</html>
